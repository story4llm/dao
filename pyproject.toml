[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dao-certified-runtime"
version = "0.3.0"
description = "Machine-enforced runtime for auditable spot and GC gold cognition bundles"
requires-python = ">=3.11"
dependencies = [
  "jsonschema[format]>=4.23,<5",
]

[tool.setuptools.packages.find]
include = ["dao_runtime*"]
